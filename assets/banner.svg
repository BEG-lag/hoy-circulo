<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">hoy·circulo</title>
  <desc id="d">¿Hoy circulas? Hoy No Circula, verificación y contingencias en el Valle de México. Una semana de ejemplo: el martes no circula.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#eceee6" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0" r="0.8">
      <stop offset="0" stop-color="#cfff45" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#cfff45" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    .serif { font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, 'Times New Roman', serif; font-style: italic; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out infinite; }
    .sweep { animation: sweep 7s steps(7, end) infinite; }
    .caret { animation: blink 1.1s steps(1, end) infinite; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: fill 6s ease-in-out infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(2.4); opacity: 0; } }
    @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(434px); } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes fill { 0% { transform: scaleX(0.08); } 60%, 100% { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .sweep, .caret, .bar { animation: none; }
      .pulse { opacity: 0; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="#0a0c10"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>

    <!-- brand -->
    <g transform="translate(96 92)">
      <circle class="pulse" r="24" fill="none" stroke="#cfff45" stroke-width="3"/>
      <circle r="24" fill="none" stroke="#cfff45" stroke-width="7"/>
      <circle r="10" fill="#cfff45"/>
    </g>
    <text x="138" y="104" class="serif" font-size="40" font-weight="500" fill="#cfff45">hoy</text>
    <text x="188" y="103" class="mono" font-size="31" font-weight="700" fill="#eceee6">·circulo</text>

    <!-- headline -->
    <text x="68" y="232" class="serif" font-size="98" font-weight="500" fill="#cfff45">¿Hoy circulas?</text>
    <text x="72" y="286" class="mono" font-size="22" font-weight="700" fill="#eceee6">Hoy No Circula · verificación · contingencias</text>
    <text x="72" y="322" class="mono" font-size="16" fill="#969dab">CDMX + Edomex · PWA sin conexión · calendario .ics · sin rastreo<tspan class="caret" fill="#cfff45"> _</tspan></text>
    <g transform="translate(72 348)">
      <rect width="132" height="30" rx="15" fill="none" stroke="#ffb648" stroke-opacity="0.7"/>
      <text x="66" y="20" text-anchor="middle" class="mono" font-size="13" letter-spacing="2" fill="#ffb648">NO OFICIAL</text>
    </g>

    <!-- week card -->
    <g transform="translate(764 64)">
      <rect width="468" height="292" rx="18" fill="#11141b" stroke="#eceee6" stroke-opacity="0.12"/>
      <rect x="0" y="22" width="5" height="248" rx="2.5" fill="#ff5d47"/>
      <text x="28" y="40" class="mono" font-size="13" letter-spacing="1.5" fill="#969dab">PLACA ···-··7 · HOLOGRAMA 1</text>
      <text x="28" y="80" class="mono" font-size="30" font-weight="700" fill="#eceee6">Hoy <tspan fill="#ff5d47">NO</tspan> circulas</text>
      <text x="28" y="106" class="mono" font-size="15" fill="#eceee6">de 5:00 a 22:00 · engomado rosa</text>

      <!-- day cells -->
      <g transform="translate(17 132)">
        <rect class="sweep" x="0" y="-4" width="58" height="96" rx="12" fill="#cfff45" fill-opacity="0.08" stroke="#cfff45" stroke-opacity="0.55"/>
        <g class="mono" font-size="13" fill="#969dab" text-anchor="middle">
          <text x="29" y="18">LUN</text><text x="91" y="18">MAR</text><text x="153" y="18">MIÉ</text><text x="215" y="18">JUE</text>
          <text x="277" y="18">VIE</text><text x="339" y="18">SÁB</text><text x="401" y="18">DOM</text>
        </g>
        <g stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <g transform="translate(29 56)"><circle r="17" fill="none" stroke="#cfff45"/><path d="M-7 0 -2 5 7 -5" stroke="#cfff45"/></g>
          <g transform="translate(91 56)"><circle r="17" fill="#ff5d47" stroke="#ff5d47"/><path d="M-6 -6 6 6M6 -6 -6 6" stroke="#0a0c10"/></g>
          <g transform="translate(153 56)"><circle r="17" fill="none" stroke="#cfff45"/><path d="M-7 0 -2 5 7 -5" stroke="#cfff45"/></g>
          <g transform="translate(215 56)"><circle r="17" fill="none" stroke="#cfff45"/><path d="M-7 0 -2 5 7 -5" stroke="#cfff45"/></g>
          <g transform="translate(277 56)"><circle r="17" fill="none" stroke="#cfff45"/><path d="M-7 0 -2 5 7 -5" stroke="#cfff45"/></g>
          <g transform="translate(339 56)"><circle r="17" fill="#ff5d47" stroke="#ff5d47"/><path d="M-6 -6 6 6M6 -6 -6 6" stroke="#0a0c10"/></g>
          <g transform="translate(401 56)"><circle r="17" fill="none" stroke="#cfff45"/><path d="M-7 0 -2 5 7 -5" stroke="#cfff45"/></g>
        </g>
      </g>

      <!-- verification -->
      <text x="28" y="258" class="mono" font-size="13" letter-spacing="1.5" fill="#969dab">VERIFICACIÓN · AGO Y SEP</text>
      <rect x="28" y="268" width="412" height="6" rx="3" fill="#191d27"/>
      <rect class="bar" x="28" y="268" width="412" height="6" rx="3" fill="#7fd8ff"/>
    </g>
  </g>
</svg>
